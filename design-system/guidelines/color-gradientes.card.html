<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);font:var(--type-body)}.row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}.sw{flex:1;min-width:60px;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;min-height:72px;box-shadow:var(--shadow-xs)}.sw b{font-family:var(--font-body);font-size:11px;font-weight:500;letter-spacing:.02em}.sw i{font-family:var(--font-mono);font-size:10px;font-style:normal;opacity:.75}</style></head><body><div class="row"><div class="sw" style="background:transparent;position:relative;overflow:hidden;min-height:96px"><span style="position:absolute;inset:0;background:var(--gradient-lulo)"></span><b style="position:relative;color:#fff">lulo</b><i style="position:relative;color:#fff">--gradient-lulo</i></div><div class="sw" style="background:transparent;position:relative;overflow:hidden;min-height:96px"><span style="position:absolute;inset:0;background:var(--gradient-pulpa)"></span><b style="position:relative;color:#fff">pulpa</b><i style="position:relative;color:#fff">--gradient-pulpa</i></div><div class="sw" style="background:var(--orange-300);position:relative;overflow:hidden;min-height:96px"><span style="position:absolute;inset:0;background:var(--gradient-protect)"></span><b style="position:relative;color:#fff">protect</b><i style="position:relative;color:#fff">--gradient-protect</i></div></div></body></html>
