<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);font:var(--type-body)}.row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}.sw{flex:1;min-width:60px;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;min-height:72px;box-shadow:var(--shadow-xs)}.sw b{font-family:var(--font-body);font-size:11px;font-weight:500;letter-spacing:.02em}.sw i{font-family:var(--font-mono);font-size:10px;font-style:normal;opacity:.75}</style></head><body><div class="row"><div class="sw" style="background:var(--signal-good);color:var(--cream-50)"><b>good</b><i>#5A8747</i></div><div class="sw" style="background:var(--signal-warn);color:var(--cream-50)"><b>warn</b><i>#C98A1E</i></div><div class="sw" style="background:var(--signal-stop);color:var(--cream-50)"><b>stop</b><i>#B8452C</i></div><div class="sw" style="background:var(--signal-info);color:var(--cream-50)"><b>info</b><i>#3F6E7A</i></div></div></body></html>
