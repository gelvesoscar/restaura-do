<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-page);display:flex;gap:20px;align-items:stretch}
.box{flex:1;background:var(--cream-200);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:26px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.tape{position:absolute;top:0;bottom:0;left:56%;width:64px;background:var(--gradient-pulpa);opacity:.9}
.msg{width:230px;background:var(--surface-inverse);color:var(--cream-200);border-radius:var(--radius-md);padding:24px;display:flex;flex-direction:column;justify-content:center;gap:10px}</style></head><body>
<div class="box"><div class="wordmark" style="font-size:30px">comounlulo<em>.co</em></div>
<div style="font-family:var(--font-display);font-size:22px;color:var(--ink-700);max-width:16ch;position:relative">Lo que restaura viene de adentro.</div>
<div style="font-family:var(--font-body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)">Abrir por aquí</div><div class="tape"></div></div>
<div class="msg"><span style="font-family:var(--font-body);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-300)">Tarjeta interior</span>
<span style="font-family:var(--font-display);font-size:22px;color:var(--cream-50);line-height:1.2">Una cápsula al día, con el desayuno.</span>
<span style="font-family:var(--font-body);font-size:12px;line-height:1.6">Sin ciclos complicados. La constancia hace el trabajo.</span></div>
</body></html>
