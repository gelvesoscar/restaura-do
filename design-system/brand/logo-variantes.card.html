<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-page)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{border-radius:var(--radius-md);height:130px;display:grid;place-items:center;border:1px solid var(--border-hairline)}
.cap{font-family:var(--font-body);font-size:11px;color:var(--text-muted);margin-top:8px;line-height:1.5}
img{width:60px;height:60px;display:block}
.no{display:flex;gap:16px;margin-top:18px;align-items:center;font-family:var(--font-body);font-size:12px;color:var(--text-muted)}
.no span b{color:var(--signal-stop)}</style></head><body>
<div class="grid">
<div><div class="tile" style="background:var(--surface-card)"><img src="../assets/logo-lulo.svg" alt=""></div><div class="cap">Full color sobre crema — uso por defecto</div></div>
<div><div class="tile" style="background:var(--cream-200)"><img src="../assets/logo-lulo-ink.svg" alt=""></div><div class="cap">Tinta — grabado, factura, blanco y negro</div></div>
<div><div class="tile" style="background:var(--brand)"><img src="../assets/logo-lulo-cream.svg" alt=""></div><div class="cap">Crema sobre naranja — empaque y redes</div></div>
<div><div class="tile" style="background:var(--surface-inverse)"><img src="../assets/logo-lulo-min.svg" alt=""></div><div class="cap">Versión mínima — favicon, sellos, ≤22 px</div></div>
</div>
<div class="no"><span><b>No:</b> rotar el símbolo</span><span><b>No:</b> cambiar el verde por otro tono</span><span><b>No:</b> añadir sombra o contorno</span><span><b>No:</b> encerrarlo en cuadrado</span></div>
</body></html>
